<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fc;
        }

        .navbar{
            background:#0d6efd;
        }

        .navbar-brand{
            color:white !important;
            font-size:30px;
            font-weight:bold;
        }

        .chat-container{
            width:75%;
            margin:30px auto;
        }

        #chatBox{
            height:550px;
            overflow-y:auto;
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        .user{
            text-align:right;
            margin-bottom:15px;
        }

        .bot{
            text-align:left;
            margin-bottom:15px;
        }

        .message{
            display:inline-block;
            max-width:75%;
            padding:12px 18px;
            border-radius:15px;
            word-wrap:break-word;
        }

        .user .message{
            background:#0d6efd;
            color:white;
        }

        .bot .message{
            background:#e9ecef;
            color:black;
        }

        .input-area{
            display:flex;
            margin-top:15px;
        }

        .input-area input{
            flex:1;
            padding:12px;
            border-radius:8px 0 0 8px;
            border:1px solid #ccc;
        }

        .input-area button{
            border-radius:0 8px 8px 0;
        }
    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg px-4">

    <a class="navbar-brand" href="#">
        🤖 AI Student Chatbot
    </a>

    <div class="ms-auto">

        <a href="/dashboard" class="btn btn-light">
            Dashboard
        </a>

        <a href="/logout" class="btn btn-danger ms-2">
            Logout
        </a>

    </div>

</nav>


<div class="chat-container">

    {% if selected_note %}
    <div class="alert alert-primary py-2">
        📄 Studying from: <strong>{{ selected_note.subject }} — {{ selected_note.title }}</strong>
        <a href="/chat" class="btn btn-sm btn-outline-primary float-end">Clear Note</a>
    </div>
    {% endif %}

    <div id="chatBox">

        <!-- Previous Chat History -->

        {% for chat in chats %}

        <div class="user">
            <div class="message">
                {{ chat.question }}
            </div>
        </div>

        <div class="bot">
            <div class="message">
                {{ chat.answer }}
            </div>
        </div>

        {% endfor %}

    </div>

    <form id="chatForm">

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type your question..."
                required
            >

            <button class="btn btn-primary">
                Send
            </button>

        </div>

    </form>

</div>

<script>

const form=document.getElementById("chatForm");

const chat=document.getElementById("chatBox");

chat.scrollTop=chat.scrollHeight;

form.addEventListener("submit",async function(e){

    e.preventDefault();

    const input=document.getElementById("message");

    const message=input.value.trim();

    if(message==="") return;

    chat.innerHTML+=`
        <div class="user">
            <div class="message">${message}</div>
        </div>
    `;

    input.value="";

    chat.scrollTop=chat.scrollHeight;

    chat.innerHTML+=`
        <div class="bot" id="typing">
            <div class="message">
                Typing...
            </div>
        </div>
    `;

    chat.scrollTop=chat.scrollHeight;

    const response=await fetch("/ask",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:message,
            note_id:{{ selected_note.id if selected_note else 'null' }}
        })

    });

    const data=await response.json();

    document.getElementById("typing").remove();

    chat.innerHTML+=`
        <div class="bot">
            <div class="message">${data.answer}</div>
        </div>
    `;

    chat.scrollTop=chat.scrollHeight;

});

</script>

</body>
</html>
