<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submissions | Faculty</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold">Student Submissions</h2><p class="text-muted mb-0">Review work submitted for faculty assignments.</p></div><a href="{{ url_for('faculty_dashboard') }}" class="btn btn-dark">Dashboard</a></div>
<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Student</th><th>Assignment</th><th>Subject</th><th>Submitted</th><th>Status</th><th></th></tr></thead><tbody>{% for s in submissions %}<tr><td><strong>{{ s.fullname }}</strong><br><small class="text-muted">{{ s.email }}</small></td><td>{{ s.title }}</td><td>{{ s.subject }}</td><td>{{ s.submitted_at }}</td><td><span class="badge text-bg-success">{{ s.status }}</span></td><td><a href="{{ url_for('faculty_download_submission', submission_id=s.id) }}" class="btn btn-sm btn-outline-primary">Download</a></td></tr>{% else %}<tr><td colspan="6" class="text-center py-5 text-muted">No submissions yet.</td></tr>{% endfor %}</tbody></table></div></div></div></body></html>
