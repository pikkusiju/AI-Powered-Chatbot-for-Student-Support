<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Assignment | Faculty</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fb}.card{border:0;border-radius:20px;box-shadow:0 10px 30px rgba(20,30,60,.08)}</style>
</head>
<body>
<div class="container py-5" style="max-width:850px">
<a href="{{ url_for('faculty_dashboard') }}" class="btn btn-light mb-4">← Faculty Dashboard</a>
<div class="card p-4 p-md-5">
<h2 class="fw-bold">Create & Assign Assignment</h2>
<p class="text-muted">Upload the official assignment file. Students will only see assignments assigned to them.</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="POST" enctype="multipart/form-data">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Subject</label><input name="subject" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
<div class="col-12"><label class="form-label">Description / Instructions</label><textarea name="description" class="form-control" rows="4" placeholder="Instructions, questions, marks, submission requirements..."></textarea></div>
<div class="col-md-6"><label class="form-label">Due Date</label><input type="datetime-local" name="due_date" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Assign To</label><select name="assigned_student_id" class="form-select"><option value="">All Students</option>{% for s in students %}<option value="{{ s.id }}">{{ s.fullname }} — {{ s.email }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Assignment File</label><input type="file" name="file" class="form-control" required></div>
<div class="col-12"><button class="btn btn-primary px-4">Publish Assignment</button></div>
</div></form></div></div>
</body></html>
