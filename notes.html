<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Notes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="d-flex justify-content-between mb-4">

<h2>📚 Study Notes</h2>

<div>

<a href="/dashboard" class="btn btn-secondary">
Dashboard
</a>

</div>

</div>

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>ID</th>
<th>Subject</th>
<th>Title</th>
<th>Uploaded</th>
<th>Study with AI</th>
<th>Download</th>

</tr>

</thead>

<tbody>

{% for note in notes %}

<tr>

<td>{{ note.id }}</td>

<td>{{ note.subject }}</td>

<td>{{ note.title }}</td>

<td>{{ note.uploaded_at }}</td>

<td>
<a href="/chat?note_id={{ note.id }}" class="btn btn-success btn-sm">
Study with AI
</a>
</td>

<td>
<a href="/download_note/{{ note.filename }}"
class="btn btn-primary btn-sm">
Download
</a>
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
